<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Base Rounded Container with subtle 3D border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#60a5fa" stroke-width="1.5" stroke-opacity="0.4"/>
  
  <!-- Subtle Inner Top Highlight -->
  <path d="M4 18C4 10.268 10.268 4 18 4H46C53.732 4 60 10.268 60 18V22C60 22 50 18 32 18C14 18 4 22 4 22V18Z" fill="#ffffff" fill-opacity="0.12"/>

  <!-- House Architectural Structure -->
  <g filter="url(#shadow)">
    <!-- Roof with modern overhang -->
    <path d="M32 14L13 29.5C12.3 30.1 12.8 31.2 13.7 31.2H17V46C17 47.1 17.9 48 19 48H27V36C27 34.9 27.9 34 29 34H35C36.1 34 37 34.9 37 36V48H45C46.1 48 47 47.1 47 46V31.2H50.3C51.2 31.2 51.7 30.1 51 29.5L32 14Z" fill="url(#roofGrad)"/>
    
    <!-- Location Pin / Connection Dot Accent in the Doorway -->
    <circle cx="32" cy="41" r="3.5" fill="#2563eb"/>
    
    <!-- Modern Chimney / Geo-signal indicator -->
    <rect x="40" y="16" width="4" height="7" rx="1" fill="#bfdbfe"/>
  </g>
</svg>
